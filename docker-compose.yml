services:
  smartconnectpb:
    build: ./pb
    container_name: smartconnectpb
    restart: unless-stopped
    environment:
      - TZ=Africa/Johannesburg
      - PB_ADMIN_EMAIL=${PB_ADMIN_EMAIL}
      - PB_ADMIN_PASSWORD=${PB_ADMIN_PASSWORD}
    volumes:
      - smartconnect_pb_data:/pb/pb_data
    ports:
      - "127.0.0.1:8090:8090"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8090/api/health"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  smartconnectapi:
    build: ./api
    container_name: smartconnectapi
    restart: unless-stopped
    depends_on:
      smartconnectpb:
        condition: service_healthy
    environment:
      - TZ=Africa/Johannesburg
      - PB_URL=http://smartconnectpb:8090
      - PB_ADMIN_EMAIL=${PB_ADMIN_EMAIL}
      - PB_ADMIN_PASSWORD=${PB_ADMIN_PASSWORD}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - NETCASH_SERVICE_ID=${NETCASH_SERVICE_ID:-}
      - NETCASH_HASH_KEY=${NETCASH_HASH_KEY:-}
      - YEASTAR_BASE_URL=${YEASTAR_BASE_URL:-}
      - YEASTAR_CLIENT_ID=${YEASTAR_CLIENT_ID:-}
      - YEASTAR_CLIENT_SECRET=${YEASTAR_CLIENT_SECRET:-}
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-http://localhost:8080}
      - BROADCAST_WORKER=${BROADCAST_WORKER:-1}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8001:8000"

  smartconnectweb:
    build: ./web
    container_name: smartconnectweb
    restart: unless-stopped
    depends_on:
      smartconnectpb:
        condition: service_healthy
    environment:
      - TZ=Africa/Johannesburg
    ports:
      - "8080:80"

volumes:
  smartconnect_pb_data:

# ponytail: attach to dokploy's overlay so Traefik can resolve container names
networks:
  default:
    name: dokploy-network
    external: true
