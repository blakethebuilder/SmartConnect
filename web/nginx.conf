server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  location /pb/ {
    proxy_pass http://smartconnectpb:8090/;
    proxy_set_header Host $host;
  }

  location /api/ {
    proxy_pass http://smartconnectapi:8000/api/;
    proxy_set_header Host $host;
  }

  location /webhooks/ {
    proxy_pass http://smartconnectapi:8000;
    proxy_set_header Host $host;
  }

  # ponytail: SPA fallback, no-cache so deploys never serve stale index
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
  }
}
